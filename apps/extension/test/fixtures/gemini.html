<!-- Hand-made fixture mirroring gemini.google.com's believed markup. Not copied from the live site; check it there. -->
<chat-window>
  <div class="conversation-container">
    <user-query>
      <user-query-content>
        <span class="cdk-visually-hidden">You said</span>
        <div class="query-text"><p class="query-text-line">Plan a three day trip to Lisbon</p></div>
      </user-query-content>
    </user-query>
    <model-response>
      <div class="response-container">
        <button type="button">Show thinking</button>
        <message-content>
          <div class="markdown markdown-main-panel"><p>Day 1: Alfama and the castle.</p></div>
        </message-content>
        <div class="response-footer"><button type="button">Share</button></div>
      </div>
    </model-response>
  </div>
  <div class="conversation-container">
    <user-query>
      <user-query-content>
        <div class="query-text"><p class="query-text-line">Make day 2 cheaper</p></div>
      </user-query-content>
    </user-query>
  </div>
</chat-window>
<input-area-v2>
  <rich-textarea>
    <div class="ql-editor textarea" contenteditable="true">
      <p>And add a food tour</p>
    </div>
  </rich-textarea>
</input-area-v2>
