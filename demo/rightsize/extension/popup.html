<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Right-size</title>
<style>
  :root { --bg:#ffffff; --fg:#14171c; --muted:#5b6370; --line:#d9dde3; --accent:#9a5b00; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1f26; --fg:#e8ebf0; --muted:#a2aab6; --line:#2e3440; --accent:#e3a64a; color-scheme: dark; } }
  body { margin: 0; padding: 14px 16px; width: 280px; background: var(--bg); color: var(--fg);
         font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; gap: 14px; }
  h1 { font-size: 15px; margin: 0; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=text], select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  output { color: var(--fg); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1>Right-size</h1>
  <label for="budget">Plan usage left: <output id="budget-out">100%</output>
    <input type="range" id="budget" min="0" max="100" step="5" value="100">
  </label>
  <label class="row" for="save"><input type="checkbox" id="save"> Saving usage for something big later</label>
  <label for="tier">Model I'm using
    <select id="tier">
      <option value="auto">Detect from the page</option>
      <option value="small">Small (Haiku, Flash-Lite, mini)</option>
      <option value="medium">Medium (Sonnet, Flash)</option>
      <option value="frontier">Frontier (Opus, Fable, Pro, Thinking)</option>
    </select>
  </label>
  <label for="server">Router address
    <input type="text" id="server" value="http://localhost:8000">
  </label>
  <script src="popup.js"></script>
</body>
</html>
